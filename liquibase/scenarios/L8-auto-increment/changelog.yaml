databaseChangeLog:
  # autoIncrement: true -> PostgreSQL GENERATED BY DEFAULT AS IDENTITY, MySQL AUTO_INCREMENT,
  # SQL Server IDENTITY(start, step).
  # No incrementBy: Liquibase rejects it on MySQL ("incrementBy is not allowed on mysql"), where
  # the step is a SERVER-wide setting (auto_increment_increment), not a column property.
  - changeSet:
      id: 1-create-invoice
      author: demo
      changes:
        - createTable:
            tableName: invoice
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  startWith: 1000
                  constraints:
                    primaryKey: true
              - column:
                  name: note
                  type: varchar(50)

  - changeSet:
      id: 2-insert-invoices
      author: demo
      changes:
        - insert: { tableName: invoice, columns: [ { column: { name: note, value: first } } ] }
        - insert: { tableName: invoice, columns: [ { column: { name: note, value: second } } ] }
        - insert: { tableName: invoice, columns: [ { column: { name: note, value: third } } ] }

  # Sequences: PostgreSQL and SQL Server have them, MySQL doesn't.
  # valueSequenceNext generates nextval('seq') / NEXT VALUE FOR seq.
  - changeSet:
      id: 3-sequence
      author: demo
      dbms: postgresql, mssql
      changes:
        - createSequence:
            sequenceName: document_number_seq
            startValue: 5000
        - createTable:
            tableName: document
            columns:
              - column: { name: number, type: bigint, constraints: { primaryKey: true } }
              - column: { name: title, type: varchar(50) }
        - insert:
            tableName: document
            columns:
              - column: { name: number, valueSequenceNext: document_number_seq }
              - column: { name: title, value: numbered by a sequence }

  # Turning an EXISTING column into an auto-increment column.
  # SQL Server can't add IDENTITY to an existing column (Liquibase refuses: "not supported on mssql").
  # There you'd create a new table/column and copy the data.
  - changeSet:
      id: 4-add-auto-increment-later
      author: demo
      dbms: postgresql, mysql
      changes:
        - createTable:
            tableName: legacy_counter
            columns:
              - column: { name: id, type: bigint, constraints: { primaryKey: true, nullable: false } }
              - column: { name: note, type: varchar(20) }
        - addAutoIncrement:
            tableName: legacy_counter
            columnName: id
            columnDataType: bigint
            startWith: 100
