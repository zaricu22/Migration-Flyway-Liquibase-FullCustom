databaseChangeLog:
  # WHAT GOES WRONG (2): two ON DELETE CASCADE paths from one table to another.
  #   department -> employee -> assignment
  #   department -> project  -> assignment
  # PostgreSQL and MySQL: fine. SQL Server rejects the second path:
  # "Introducing FOREIGN KEY constraint 'fk_assignment_project' on table 'assignment' may cause
  #  cycles or multiple cascade paths."
  - changeSet:
      id: 1-create-tables
      author: demo
      changes:
        - createTable:
            tableName: department
            columns:
              - column: { name: id, type: int, constraints: { primaryKey: true } }
        - createTable:
            tableName: employee
            columns:
              - column: { name: id, type: int, constraints: { primaryKey: true } }
              - column: { name: department_id, type: int, constraints: { nullable: false } }
        - createTable:
            tableName: project
            columns:
              - column: { name: id, type: int, constraints: { primaryKey: true } }
              - column: { name: department_id, type: int, constraints: { nullable: false } }
        - createTable:
            tableName: assignment
            columns:
              - column: { name: employee_id, type: int, constraints: { nullable: false } }
              - column: { name: project_id, type: int, constraints: { nullable: false } }

  - changeSet:
      id: 2-fk-employee-department
      author: demo
      changes:
        - addForeignKeyConstraint: { constraintName: fk_employee_department, baseTableName: employee, baseColumnNames: department_id, referencedTableName: department, referencedColumnNames: id, onDelete: CASCADE }
  - changeSet:
      id: 3-fk-project-department
      author: demo
      changes:
        - addForeignKeyConstraint: { constraintName: fk_project_department, baseTableName: project, baseColumnNames: department_id, referencedTableName: department, referencedColumnNames: id, onDelete: CASCADE }
  - changeSet:
      id: 4-fk-assignment-employee
      author: demo
      changes:
        - addForeignKeyConstraint: { constraintName: fk_assignment_employee, baseTableName: assignment, baseColumnNames: employee_id, referencedTableName: employee, referencedColumnNames: id, onDelete: CASCADE }
  # the second cascade path to assignment: fails on SQL Server
  - changeSet:
      id: 5-fk-assignment-project
      author: demo
      changes:
        - addForeignKeyConstraint: { constraintName: fk_assignment_project, baseTableName: assignment, baseColumnNames: project_id, referencedTableName: project, referencedColumnNames: id, onDelete: CASCADE }
